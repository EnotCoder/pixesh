name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # 22.04 keeps glibc at 2.35, so the binaries run on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxkbcommon-dev
      - run: cargo build --release
      - name: Package install.sh archive and AppImage
        run: bash scripts/package-linux.sh
      - name: Smoke-test the AppImage
        run: dist/Pixesh-*.AppImage --appimage-extract-and-run --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - run: cargo build --release
      - name: Build the setup.exe
        shell: bash
        run: bash scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
