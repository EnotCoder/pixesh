[package]
name = "pixesh"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "pixesh"
crate-type = ["cdylib", "rlib"]

[features]
default = ["desktop"]

# Save UI state (panel visibility/sizes, window geometry, preferences) to disk.
persistence = ["eframe/persistence"]

# Desktop build: toolbar top, layers right, timeline bottom
desktop = [
    "eframe/glow",
    "eframe/default_fonts",
    "eframe/accesskit",
    "eframe/wayland",
    "eframe/x11",
    "eframe/web_screen_reader",
    "persistence",
    "rfd",
]

# Native file dialogs (GTK3).
rfd = ["dep:rfd"]

[dependencies]
eframe = { version = "0.31", default-features = false }
image = "0.25"

# Derives for the persisted preference struct in src/app/config.rs.
serde = { version = "1", features = ["derive"] }

# GTK3 file dialogs; Linux only in practice.
rfd = { version = "0.15", default-features = false, features = ["gtk3"], optional = true }
